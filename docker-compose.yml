version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amentorz-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amentorz_dev
    ports:
      # Override when 5432 is taken locally: POSTGRES_PORT=5434 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amentorz_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amentorz_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amentorz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amentorz_postgres_data:
