    "/auth/register": {
      "post": {
        "operationId": "registerStudent",
        "tags": [
          "Identity"
        ],
        "summary": "Create student account from the four onboarding steps",
        "description": "Public; no authenticated identity required. One transaction: consume emailVerificationToken; create the user with fullName, mobileNumber, timezone, verified email and the student role only; create the student profile, subjects and guardian contact; record policy acceptances with IP and user agent; link the guardian consent and copy the guardian name and relationship onto it; audit events. Under 18 is computed on the server from dateOfBirth (UTC date); the threshold is 18 for both India and the UAE (decided 2026-10-29). When under 18: guardian, consentToken and the Child Safety Policy acceptance are required; consent fullName and dateOfBirth must equal the submitted values, or 422 and the student re-signs. Adults: guardian is optional and stored when sent; consentToken is rejected with 422. Board required only when the category requires it. Every curriculum must match the selected category, board and level. Duplicate email returns 409. Unknown fields including role, isActive or permissions are rejected. DECISION REQUIRED: (1) Step 3 copy promises SMS; Phase 1 is email only. (2) After success: automatic login or redirect to the student login. (3) Final relationship list. (4) Whether adults see step 3 at all (UI says it is required for every student under 18). Decided 2026-10-29: password rule (8 characters with one number) and acceptance of project plan risk R4 (guardian identity not verified; written acceptance to be filed). Country is derived from the mobile number for now. See docs/PENDING_DECISIONS.md.",
        "x-required-role": "public",
        "x-review-status": "decision-required",
        "security": [],
        "responses": {
          "201": {
            "description": "Create student account from the four onboarding steps.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/registerStudentResponse"
