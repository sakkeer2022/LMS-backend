{
  "openapi": "3.0.3",
  "info": {
    "title": "Amentorz Sprint 1 API \u2014 review draft",
    "version": "0.1.0-draft",
    "description": "PROPOSED CONTRACT ONLY. No client acceptance approval evidence supplied. No endpoint implementation implied. x-review-status separates ready-for-review from decision-required operations. Backend docs/openapi.yaml is the sole proposed Amentorz contract; existing JSDoc Swagger describes legacy template behavior and is not this draft. All paths below are relative to /api/v1. No booking, payment, live-session, earnings, scoring, messaging or infrastructure-control endpoints.\n\nExisting envelope retained: success/message/data/meta; errors use success=false/message/errors/traceId (no new error-code field). Unknown fields rejected; strict Zod DTO validation proposed for every body, query and path. Strings trimmed before length checks except credentials; identifiers UUID, UTC RFC3339 timestamps. 422 validation, 409 conflict, 401 authentication, 403 permission/CSRF, 404 concealed resources. All protected responses and auth challenges use Cache-Control: no-store. Credentials never logged. Every unsafe request requires signed _csrf cookie plus x-csrf-token, even when unauthenticated. CSRF is additional to authentication, never a replacement.\n\nProposed authentication reuses HttpOnly JWT access/refresh cookies, same-origin frontend rewrite, SameSite=Strict, Secure in deployed HTTPS, no Domain. No JSON token delivery/localStorage. Access cookie Path=/; refresh Path=/api/v1/auth. PostgreSQL session family and token hashes are authoritative; every protected request checks live user activity, role and session version. Immediate server revocation on logout, password reset/change, account deactivation and any existing role change; refresh rotation and replay revoke family. Fail closed when authoritative checks unavailable. Token lifetimes, re-authentication freshness, OTP expiry, attempt, lockout and resend limits are configuration values, not fixed in this contract; email OTPs have six digits. Refresh/logout/session-management routes remain usable during faculty onboarding restrictions. No public faculty/admin registration or role elevation API. Initial admin is an operator-only, audited provisioning command with prompted or secure-secret input, never a public endpoint or seeded password.\n\nPublic faculty eligibility is active user AND verified email AND active faculty profile AND current required terms accepted AND approved AND published AND at least one active valid assignment. This is a shared prerequisite for future bookability, not a guarantee of future booking, payment or attendance eligibility. Future bookability also rechecks selected assignment/price and later-sprint rules. All moderation and eligibility checks apply to content bytes as well as listings. Configuration/catalogue/pricing changes audit actor, UTC time and redacted values. Infrastructure backups, CI and deployment are operational procedures, not new API endpoints."
  },
